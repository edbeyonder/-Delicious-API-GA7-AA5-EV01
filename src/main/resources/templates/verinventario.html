<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ver Inventario</title>
<link rel="stylesheet" th:href="@{/tables.css}">
</head>
<body>
<a th:href="@{/dashboard}" class="btn-regresar">
    &#11013; Regresar
</a>
<h1>Inventario de Productos</h1>


<div th:if="${mensaje}"
     class="mensaje-exito"
     th:text="${mensaje}">
</div>

<table>
   <thead>
<tr>
    <th>Producto</th>
    <th>Cantidad</th>
    <th>Precio</th>
    <th>Fecha Registro</th>
    <th>Acciones</th>
</tr>
</thead>

   <tbody>
    <tr th:each="inventario : ${inventarios}">
        <td th:text="${inventario.nombreProducto}"></td>
        <td th:text="${inventario.cantidad}"></td>
        <td th:text="${inventario.precio}"></td>
        <td th:text="${inventario.fechaRegistro}"></td>
         <td>
   <a th:href="@{/inventario/editar/{id}(id=${inventario.idProducto})}"
   class="btn-editar">
    Actualizar
</a>
  <a th:href="@{/inventario/eliminar/{id}(id=${inventario.idProducto})}"
   onclick="return confirm('¿Está seguro de eliminar este producto?');"
   class="btn-eliminar">
    Eliminar
</a>
</td>

</tr>
</tbody>
</table>

</body>
</html>
